<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Database Personale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <section id="loginView" class="login-container">

        <div class="login-box">

            <h1>🗄️ Database Personale</h1>

            <p class="subtitle">
                Accedi al tuo database privato
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="La tua email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="La tua password"
                    required
                >

                <button type="submit">
                    🔐 Accedi
                </button>

            </form>

            <p id="loginMessage" class="message"></p>

        </div>

    </section>


    <!-- ========================= -->
    <!-- PANNELLO -->
    <!-- ========================= -->

    <section id="appView" class="hidden">

        <header class="topbar">

            <div>

                <h1>
                    🗄️ Il mio database
                </h1>

                <p id="userEmail"></p>

            </div>

            <button
                id="logoutBtn"
                class="logout"
            >
                🚪 Esci
            </button>

        </header>


        <main class="content">


            <!-- ========================= -->
            <!-- GESTIONE UTENTI ADMIN -->
            <!-- ========================= -->

            <section
                id="adminPanel"
                class="card hidden"
            >

                <div class="section-header">

                    <div>

                        <h2>
                            👑 Gestione utenti
                        </h2>

                        <p>
                            Gestisci gli account e i permessi.
                        </p>

                    </div>

                    <button
                        id="refreshUsersBtn"
                        class="secondary"
                        type="button"
                    >
                        🔄 Aggiorna
                    </button>

                </div>


                <!-- CREAZIONE UTENTE -->

                <div class="admin-create">

                    <h3>
                        ➕ Crea nuovo account
                    </h3>

                    <form id="createUserForm">

                        <label for="newUserEmail">
                            Email
                        </label>

                        <input
                            id="newUserEmail"
                            type="email"
                            placeholder="email@example.com"
                            required
                        >

                        <label for="newUserPassword">
                            Password iniziale
                        </label>

                        <input
                            id="newUserPassword"
                            type="password"
                            minlength="6"
                            placeholder="Minimo 6 caratteri"
                            required
                        >

                        <button type="submit">
                            👤 Crea account
                        </button>

                    </form>

                    <p
                        id="createUserMessage"
                        class="message"
                    ></p>

                </div>


                <!-- ELENCO UTENTI -->

                <div class="admin-users">

                    <h3>
                        👥 Utenti
                    </h3>

                    <div id="usersList">

                        <p class="loading">
                            Caricamento utenti...
                        </p>

                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- AGGIUNGI DATO -->
            <!-- ========================= -->

            <section class="card">

                <h2>
                    ➕ Aggiungi dato
                </h2>

                <form id="dataForm">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Nome del dato"
                        maxlength="200"
                        required
                    >

                    <label for="informazioni">
                        Informazioni
                    </label>

                    <textarea
                        id="informazioni"
                        rows="5"
                        placeholder="Scrivi le informazioni..."
                        maxlength="5000"
                    ></textarea>

                    <button type="submit">
                        💾 Salva dato
                    </button>

                </form>

                <p
                    id="dataMessage"
                    class="message"
                ></p>

            </section>


            <!-- ========================= -->
            <!-- ELENCO DATI -->
            <!-- ========================= -->

            <section class="card">

                <div class="section-header">

                    <h2>
                        📋 I miei dati
                    </h2>

                    <button
                        id="refreshBtn"
                        class="secondary"
                        type="button"
                    >
                        🔄 Aggiorna
                    </button>

                </div>

                <div id="dataList">

                    <p class="loading">
                        Caricamento...
                    </p>

                </div>

            </section>

        </main>

    </section>


    <!-- ========================= -->
    <!-- FINESTRA MODIFICA -->
    <!-- ========================= -->

    <div
        id="editModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2>
                    ✏️ Modifica dato
                </h2>

                <button
                    id="closeModalBtn"
                    class="close-button"
                    type="button"
                >
                    ✕
                </button>

            </div>


            <form id="editForm">

                <label for="editNome">
                    Nome
                </label>

                <input
                    id="editNome"
                    type="text"
                    maxlength="200"
                    required
                >

                <label for="editInformazioni">
                    Informazioni
                </label>

                <textarea
                    id="editInformazioni"
                    rows="7"
                    maxlength="5000"
                ></textarea>

                <div class="modal-actions">

                    <button
                        id="cancelEditBtn"
                        type="button"
                        class="secondary"
                    >
                        Annulla
                    </button>

                    <button type="submit">
                        💾 Salva modifiche
                    </button>

                </div>

                <p
                    id="editMessage"
                    class="message"
                ></p>

            </form>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SUPABASE -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ========================= -->
    <!-- PROGRAMMA -->
    <!-- ========================= -->

    <script src="app.js"></script>

</body>
</html>
